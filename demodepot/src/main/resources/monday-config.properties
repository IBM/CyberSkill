# Monday.com Integration Configuration
# 
# To enable Monday.com integration:
# 1. Set monday.enabled=true
# 2. Add your Monday.com API token
# 3. Add your Board ID
# 4. Optionally add a Group ID
#
# How to get these values:
# - API Token: Go to https://monday.com > Profile > Admin > API > Generate API v2 Token
# - Board ID: Open your board in Monday.com, the ID is in the URL (e.g., https://monday.com/boards/1234567890)
# - Group ID: Optional - if you want tasks in a specific group/section

# Enable or disable Monday.com integration
monday.enabled=true

# Your Monday.com API Token (starts with "eyJ...")
monday.api.token=eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjYzNDQ2NzQ4NSwiYWFpIjoxMSwidWlkIjo1ODQzMjI1NiwiaWFkIjoiMjAyNi0wMy0xN1QyMzo1MTo1OS4wMDBaIiwicGVyIjoibWU6d3JpdGUiLCJhY3RpZCI6MTM1MzY5ODEsInJnbiI6InVzZTEifQ.j14EFGZ8zOgMgzzcyqI_i1h0NT5WfrYXso8urdA64cY

# Your Monday.com Board ID (numeric)
monday.board.id=18404366745

# Optional: Group ID within the board (leave empty to use default group)
monday.group.id=


# Column IDs (must match your board structure)
monday.column.status=status
monday.column.date=date4
monday.column.files=file_mm1j8w9f

# Group IDs for demo type routing
