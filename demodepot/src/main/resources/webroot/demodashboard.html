    // --- 2) Actual API fetch (public endpoint) ---
async function fetchDemoRequestsFromAPI() {
  try {
    const res = await fetch("/api/demo-requests/public");
    if (!res.ok) {
      throw new Error("Failed to fetch demo requests");
    }
    return await res.json(); // should be { demo_requests: [...] }
  } catch (err) {
    console.error("API fetch failed:", err);
    return null; // fallback will be used
  }
}


    // --- 3) Utilities ---
    function formatDateISOToDisplay(iso) {
      const d = new Date(iso);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function computeTypeCounts(items) {
      const counts = {};
      for (const r of items) {
        counts[r.demo_type] = (counts[r.demo_type] || 0) + 1;
      }
      return counts;
    }

    function computeMonthlyCounts(items, field = "created_at") {
      const counts = {};
      for (const r of items) {
        const d = new Date(r[field]);
        if (isNaN(d)) continue;
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        counts[key] = (counts[key] || 0) + 1;
      }
      return Object.entries(counts)
        .sort(([a], [b]) => (a > b ? 1 : a < b ? -1 : 0))
        .reduce((acc, [k, v]) => {
          acc[k] = v;
          return acc;
        }, {});
    }

    

    // --- 5) Table rendering ---
    function renderTable(items) {
      const tbody = document.querySelector("#requestsTable tbody");
      const loadingRow = document.getElementById("loadingMessage");
      if (loadingRow) loadingRow.parentElement.remove();

      const fragment = document.createDocumentFragment();

      for (const r of items) {
        const tr = document.createElement("tr");
        
        const statusBadges = {
          'draft': 'badge-draft',
          'submitted': 'badge-submitted',
          'in_progress': 'badge-in-progress',
          'completed': 'badge-completed',
          'cancelled': 'badge-cancelled'
        };
        const badgeClass = statusBadges[r.status] || 'badge-draft';

        tr.innerHTML = `
          <td>${r.pm_owner}</td>
          <td>${r.demo_type}</td>
          <td>${r.product_name}</td>
          <td>${formatDateISOToDisplay(r.delivery_date)}</td>
          <td>
            <a href="${r.demo_url}" target="_blank" style="color: var(--primary-color); text-decoration: underline;">${r.title}</a>
          </td>
          <td>
            <span class="badge ${badgeClass}">
              ${r.status ? r.status.replace('_', ' ') : 'N/A'}
            </span>
          </td>
          <td>
            ${r.existing_docs_path
              ? `<a href="uploads/${r.existing_docs_path}" target="_blank" style="color: var(--primary-color); text-decoration: underline;">📄 Download</a>`
              : "—"}
          </td>
          <td>
            ${r.demo_script_path
              ? `<a href="uploads/${r.demo_script_path}" target="_blank" style="color: var(--primary-color); text-decoration: underline;">📄 Download</a>`
              : "—"}
          </td>
        `;
        fragment.appendChild(tr);
      }

      tbody.appendChild(fragment);
    }

    // --- 6) Charts ---
    let typeChart, monthlyChart;

    function renderTypeChart(ctx, items) {
      const typeCounts = computeTypeCounts(items);
      const labels = Object.keys(typeCounts);
      const data = Object.values(typeCounts);

      if (typeChart) typeChart.destroy();

      typeChart = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels,
          datasets: [
            {
              data,
              backgroundColor: [
                "#6366F1",
                "#22C55E",
                "#F59E0B",
                "#EF4444",
                "#06B6D4",
                "#A855F7",
                "#84CC16",
                "#F97316",
              ],
              borderWidth: 0,
            },
          ],
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: "bottom" },
            tooltip: { enabled: true },
          },
        },
      });
    }

    function renderMonthlyChart(ctx, items) {
      const monthlyCounts = computeMonthlyCounts(items, "created_at");
      const labels = Object.keys(monthlyCounts);
      const data = Object.values(monthlyCounts);

      if (monthlyChart) monthlyChart.destroy();

      monthlyChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [
            {
              label: "Requests",
              data,
              backgroundColor: "#6366F1",
              borderRadius: 6,
            },
          ],
        },
        options: {
          responsive: true,
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, ticks: { precision: 0 } },
          },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true },
          },
        },
      });
    }

    // --- 7) Bootstrap flow + UI wiring ---
    async function loadDataAndRender() {
      console.log('[Public Dashboard] Loading data...');
      const badge = document.getElementById("dataSourceBadge");
      let data;

      try {
        const apiData = await fetchDemoRequestsFromAPI();
        if (apiData && Array.isArray(apiData.demo_requests) && apiData.demo_requests.length) {
          data = apiData;
          console.log('[Public Dashboard] Using API data:', data.demo_requests.length, 'requests');
          if (badge) {
            badge.textContent = "✅ Source: API";
            badge.className = "badge badge-completed";
          }
        } else {
          data = fallbackData;
          console.log('[Public Dashboard] Using fallback data:', data.demo_requests.length, 'requests');
          if (badge) {
            badge.textContent = "⚠️ Source: Fallback";
            badge.className = "badge badge-info";
          }
        }
      } catch (e) {
        console.error('[Public Dashboard] Error loading data:', e);
        data = fallbackData;
        if (badge) {
          badge.textContent = "⚠️ Source: Fallback";
          badge.className = "badge badge-info";
        }
      }

      const items = data.demo_requests;

      // Clear table body before re-render
      const tbody = document.querySelector("#requestsTable tbody");
      tbody.innerHTML = `
        <tr>
          <td colspan="8" style="text-align: center; padding: 2rem;">Loading demo requests...</td>
        </tr>
      `;

      // Render table
      renderTable(items);

      // Render charts
      const typeCtx = document.getElementById("typeChart");
      const monthlyCtx = document.getElementById("monthlyChart");
      renderTypeChart(typeCtx, items);
      renderMonthlyChart(monthlyCtx, items);
      
      console.log('[Public Dashboard] Rendering complete');
    }

  </script>

    document.addEventListener("DOMContentLoaded", () => {

      const auth = checkAuth();
      const navbar = new Navbar('app-navbar', auth);
      navbar.init();
      
      // Load data
      loadDataAndRender();

      // Refresh button
      const refreshBtn = document.getElementById("refreshBtn");
      refreshBtn.addEventListener("click", () => {
        console.log('[Public Dashboard] Refresh clicked');
        showToast('Refreshing data...', 'info');
        loadDataAndRender();
      });
    });
