# CyberSkill Platform Configuration

# Server Configuration
server.port=8080
server.host=0.0.0.0

# Database Configuration
database.host=localhost
database.port=5432
database.name=cyberskill
database.username=cyberskill_user
database.password=changeme
database.pool.max.size=100

# JWT Configuration
jwt.secret=CHANGE_THIS_SECRET_IN_PRODUCTION_USE_STRONG_RANDOM_STRING
jwt.expiry.access=3600
jwt.expiry.refresh=604800
jwt.issuer=cyberskill-platform

# Security Configuration
security.bcrypt.rounds=12
security.mfa.enabled=true
security.session.timeout=1800

# CORS Configuration
cors.allowed.origins=http://localhost:8080,http://localhost:3000
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=Content-Type,Authorization,X-Requested-With
cors.max.age=3600

# File Upload Configuration
upload.max.size=10485760
upload.allowed.types=image/jpeg,image/png,image/gif,video/mp4,application/pdf

# Email Configuration (Optional)
email.enabled=false
email.smtp.host=smtp.example.com
email.smtp.port=587
email.smtp.username=
email.smtp.password=
email.from=noreply@cyberskill.com

# Logging Configuration
logging.level=INFO
logging.file.path=logs/cyberskill.log
logging.file.max.size=10MB
logging.file.max.history=30

# Certificate Configuration
certificate.storage.path=certificates
certificate.template.path=templates/certificate-template.pdf

# Content Configuration
content.storage.path=content
content.video.path=videos

# Rate Limiting
rate.limit.enabled=true
rate.limit.requests.per.minute=60
rate.limit.requests.per.hour=1000

# Cache Configuration
cache.enabled=true
cache.ttl.seconds=300

# Analytics Configuration
analytics.enabled=true
analytics.batch.size=100
analytics.flush.interval=60

